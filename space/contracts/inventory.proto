syntax = "proto3";

package entropydrop.space.inventory.v3;

// Canonical binary contract for browser backpacks, portable files, market
// uploads, and immutable CDN objects. Derived counts and the constant block id
// are intentionally omitted.
message InventoryResource {
  uint32 schema_version = 1;

  oneof content {
    BlockSet block_set = 10;
    Entity entity = 11;
    ColorSet color_set = 12;
  }
}

message Voxel {
  sint32 dx = 1;
  sint32 dy = 2;
  sint32 dz = 3;
  // Present only for micro voxels. Value = 1 + mx + 5*my + 25*mz.
  optional uint32 micro_index = 4;
  fixed32 color = 5;
}

message BlockSet {
  string name = 1;
  repeated Voxel blocks = 2;
}

message ColorSet {
  string name = 1;
  repeated fixed32 colors = 2 [packed = true];
}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

enum BodyType {
  BODY_TYPE_DYNAMIC = 0;
  BODY_TYPE_KINEMATIC = 1;
}

message BodyConfig {
  BodyType type = 1;
  optional double mass = 2;
  optional double restitution = 3;
  optional double friction = 4;
  optional bool use_gravity = 5;
  optional bool collision_enabled = 6;
}

message Seat {
  Vector3 position = 1;
}

// The entity owns exactly one root Component. Children recursively own their
// voxels and configuration, so per-voxel component indexes are unnecessary.
message Component {
  string id = 1;
  optional Vector3 pivot = 2;
  BodyConfig body = 3;
  repeated Voxel blocks = 4;
  optional string script = 5;
  bool script_disabled = 6;
  repeated Seat seats = 7;
  repeated Component children = 8;
}

enum ConstraintType {
  CONSTRAINT_TYPE_POINT = 0;
  CONSTRAINT_TYPE_HINGE = 1;
  CONSTRAINT_TYPE_WELD = 2;
}

message ConstraintLimits {
  double min = 1;
  double max = 2;
}

message EntityConstraint {
  string id = 1;
  ConstraintType type = 2;
  bool body_a_is_world = 3;
  string body_a = 4;
  string body_b = 5;
  optional Vector3 anchor_a = 6;
  optional Vector3 anchor_b = 7;
  optional Vector3 axis_a = 8;
  optional Vector3 axis_b = 9;
  optional Vector3 reference_a = 10;
  optional Vector3 reference_b = 11;
  optional ConstraintLimits limits = 12;
  double stiffness = 13;
  bool collide_connected = 14;
}

message Entity {
  string name = 1;
  Component root = 2;
  repeated EntityConstraint constraints = 3;
}

enum InventoryCategory {
  INVENTORY_CATEGORY_BLOCK_SET = 0;
  INVENTORY_CATEGORY_ENTITY = 1;
  INVENTORY_CATEGORY_COLOR_SET = 2;
}

message InventorySlot {
  uint32 index = 1;
  InventoryResource resource = 2;
}

message InventoryGroup {
  uint32 selected = 1;
  repeated InventorySlot slots = 2;
}

message Backpack {
  uint32 schema_version = 1;
  InventoryCategory active_category = 2;
  InventoryGroup block_sets = 3;
  InventoryGroup entities = 4;
  InventoryGroup color_sets = 5;
}
