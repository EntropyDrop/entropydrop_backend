syntax = "proto3";

package entropydrop.space.inventory.v7;

// Canonical binary contract for portable files, market uploads, and immutable
// CDN objects. Derived counts and the constant block id
// are intentionally omitted.
// Voxel geometry follows the authoritative realtime schema
// `space.multiplayer.v2` (see entropydrop_backend/space/contracts/protocol.proto):
// micro offsets are separate `micro_x`/`micro_y`/`micro_z` fields in 0..7 guarded
// by `is_micro`, and color is an unsigned `color_rgb` varint instead of a
// `fixed32`. This file is the single source for portable content; the realtime
// protocol must be updated together with it.
// Canonical encoders normalize every double -0.0 to +0.0; sort BlockSet.blocks
// and Component.blocks by (dx,dy,dz,is_micro,micro_x,micro_y,micro_z,color_rgb);
// and sort Component.children and Entity.constraints by Unicode code-point id
// order. Color and seat order remains significant and is preserved.
// Schema v7 is a wire-breaking change: v6 files, backpacks and CDN objects are
// intentionally rejected and are not migrated.
message InventoryResource {
  uint32 schema_version = 1;

  oneof content {
    BlockSet block_set = 10;
    Entity entity = 11;
    ColorSet color_set = 12;
  }
}

message Voxel {
  sint32 dx = 1;
  sint32 dy = 2;
  sint32 dz = 3;
  // False selects the standard 1 m voxel. True selects the micro voxel at the
  // cell-local offset below; this mirrors VoxelMutationKind in the realtime
  // schema instead of the removed packed `micro_index`.
  bool is_micro = 4;
  // Cell-local micro offsets, each in 0..7. Meaningful only when is_micro is
  // true; canonical encoders emit 0 for the standard scale.
  uint32 micro_x = 5;
  uint32 micro_y = 6;
  uint32 micro_z = 7;
  // RGB packed as 0xRRGGBB. Matches VoxelMutation.color_rgb in the realtime
  // schema; the old `fixed32 color` wire type is no longer accepted.
  uint32 color_rgb = 8;
}

message BlockSet {
  string name = 1;
  repeated Voxel blocks = 2;
}

message ColorSet {
  string name = 1;
  // Packed 0xRRGGBB values, matching Voxel.color_rgb.
  repeated uint32 colors = 2 [packed = true];
}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

enum BodyType {
  BODY_TYPE_DYNAMIC = 0;
  BODY_TYPE_KINEMATIC = 1;
}

message BodyConfig {
  BodyType type = 1;
  optional double mass = 2;
  optional double restitution = 3;
  optional double friction = 4;
  optional bool use_gravity = 5;
  optional bool collision_enabled = 6;
}

message Seat {
  Vector3 position = 1;
}

// Entity.root and Component.children alone determine root/child hierarchy;
// do not add a hierarchy kind or index. Component ids are opaque identifiers:
// no spelling has special root, child, or world semantics. Children recursively
// own their voxels and configuration, so per-voxel component indexes are
// unnecessary.
message Component {
  string id = 1;
  optional Vector3 pivot = 2;
  BodyConfig body = 3;
  repeated Voxel blocks = 4;
  optional string script = 5;
  bool script_disabled = 6;
  repeated Seat seats = 7;
  // Sibling order is non-semantic; canonical encoders and decoders sort by id.
  repeated Component children = 8;
  // Parent-relative authored transform. The root omits these fields.
  // local_rotation is restricted to the 24 axis-aligned cube orientations so
  // Stop restores every owned voxel to one shared 0.125-unit construction grid.
  optional Vector3 local_position = 9;
  optional Quaternion local_rotation = 10;
  // Orientation of the mounting frame in component-local coordinates.
  // Identity means +Y points away from the surface and -Z points forward; this
  // is also restricted to the 24 axis-aligned cube orientations.
  optional Quaternion anchor_rotation = 11;
  // Display-only, non-unique name. Empty means unnamed; UI falls back to id.
  // Names travel with subtrees and do not participate in content deduplication.
  string name = 12;
}

enum ConstraintType {
  CONSTRAINT_TYPE_POINT = 0;
  CONSTRAINT_TYPE_HINGE = 1;
  CONSTRAINT_TYPE_WELD = 2;
}

message ConstraintLimits {
  double min = 1;
  double max = 2;
}

message EntityConstraint {
  string id = 1;
  ConstraintType type = 2;
  // Absence means that side A is attached to the external world. Presence is
  // always an exact component id; no id spelling has sentinel semantics.
  optional string body_a_component_id = 3;
  string body_b_component_id = 4;
  optional Vector3 anchor_a = 5;
  optional Vector3 anchor_b = 6;
  optional Vector3 axis_a = 7;
  optional Vector3 axis_b = 8;
  optional Vector3 reference_a = 9;
  optional Vector3 reference_b = 10;
  optional ConstraintLimits limits = 11;
  double stiffness = 12;
  bool collide_connected = 13;
}

message Entity {
  reserved 1;
  reserved "name";
  // The entity display name is its root component's name (or id if unnamed).
  Component root = 2;
  repeated EntityConstraint constraints = 3;
}
